<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Live coordination console for local Claude Code sessions: peers, messages, tasks, files, decisions and reviews.">
  <title>claude-peers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <script>
    /* Apply the saved theme before first paint (dashboard.js owns the toggle). */
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { }
  </script>
  <style>
    /* ═══════════════════════════════════════════════
       claude-peers — coordination console
       Tokens first; every component reads from them.
    ═══════════════════════════════════════════════ */

    :root {
      color-scheme: dark;

      /* Surfaces: the frame (top bar, rail) is darkest, the conversation is the near-black canvas,
         panels sit one step above it, and raised elements (inputs, code, hovers) one step above that. */
      --frame: #0d0c0b;
      --stage: #11100f;
      --panel: #151413;
      --raised: #1c1b19;
      --raised-2: #252321;
      --overlay: #1e1d1b;

      --line: rgba(236, 224, 208, 0.075);
      --line-2: rgba(236, 224, 208, 0.13);
      --line-3: rgba(236, 224, 208, 0.2);
      --hover: rgba(236, 224, 208, 0.045);
      --press: rgba(236, 224, 208, 0.085);

      --ink: #ede8e1;
      --ink-body: #d8d2c9;
      --ink-2: #b4ada3;
      --ink-3: #8f887e;
      --ink-4: #615b54;

      /* One accent: primary action, selection, focus. Dark ink on accent fills. */
      --accent: #d97757;
      --accent-hi: #ec9677;
      --accent-ink: #1d0f09;
      --accent-soft: rgba(217, 119, 87, 0.14);
      --accent-line: rgba(217, 119, 87, 0.5);
      --focus: #ec9677;

      /* State colours carry meaning only (always paired with an icon or a label). */
      --ok: #74c48f;
      --ok-soft: rgba(116, 196, 143, 0.13);
      --warn: #e3b456;
      --warn-soft: rgba(227, 180, 86, 0.13);
      --bad: #f2798c;
      --bad-soft: rgba(242, 121, 140, 0.13);
      --info: #84ade9;
      --info-soft: rgba(132, 173, 233, 0.13);
      --violet: #b8a0e6;
      --violet-soft: rgba(184, 160, 230, 0.13);

      /* Peer identity hues: dashboard.js sets --h per peer; lightness/chroma are per theme. */
      --peer-l: 0.81;
      --peer-c: 0.095;
      --peer-tile-l: 0.86;
      --peer-tile-a: 0.16;

      --scrim: rgba(5, 4, 3, 0.62);
      --shadow-pop: 0 20px 50px -12px rgba(0, 0, 0, 0.62), 0 2px 8px rgba(0, 0, 0, 0.4);

      --font-sans: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;

      --topbar-h: 44px;
      --rail-w: 56px;
      --measure: 768px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --t-fast: 120ms;
      --t: 180ms;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --frame: #ebe8e3;
      --stage: #faf9f7;
      --panel: #f3f1ed;
      --raised: #ffffff;
      --raised-2: #ebe8e3;
      --overlay: #ffffff;
      --line: rgba(60, 45, 30, 0.1);
      --line-2: rgba(60, 45, 30, 0.16);
      --line-3: rgba(60, 45, 30, 0.26);
      --hover: rgba(60, 45, 30, 0.045);
      --press: rgba(60, 45, 30, 0.08);
      --ink: #1d1a16;
      --ink-body: #2e2a25;
      --ink-2: #4f4a43;
      --ink-3: #6b655d;
      --ink-4: #a39d94;
      --accent: #b5532f;
      --accent-hi: #a84a28;
      --accent-ink: #ffffff;
      --accent-soft: rgba(181, 83, 47, 0.1);
      --accent-line: rgba(181, 83, 47, 0.45);
      --focus: #b5532f;
      --ok: #2c8350;
      --ok-soft: rgba(44, 131, 80, 0.1);
      --warn: #996300;
      --warn-soft: rgba(153, 99, 0, 0.1);
      --bad: #c0304a;
      --bad-soft: rgba(192, 48, 74, 0.09);
      --info: #2f69c4;
      --info-soft: rgba(47, 105, 196, 0.09);
      --violet: #7650c0;
      --violet-soft: rgba(118, 80, 192, 0.09);
      --peer-l: 0.5;
      --peer-c: 0.12;
      --peer-tile-l: 0.45;
      --peer-tile-a: 0.12;
      --scrim: rgba(30, 24, 18, 0.36);
      --shadow-pop: 0 18px 44px -14px rgba(40, 30, 20, 0.35), 0 2px 6px rgba(40, 30, 20, 0.12);
    }

    /* ═══════ Base ═══════ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--stage);
      color: var(--ink);
      font: 400 14px/1.5 var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, h4, h5, h6, p, ul, ol, dl, dd, figure { margin: 0; }
    [hidden] { display: none !important; }
    ::selection { background: rgba(217, 119, 87, 0.32); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    * { scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border: 3px solid transparent; border-radius: 10px; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--line-3); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .skip {
      position: fixed; left: 8px; top: -60px; z-index: 100;
      padding: 8px 12px; border-radius: 8px;
      background: var(--accent); color: var(--accent-ink);
      font-weight: 600; font-size: 13px; text-decoration: none;
    }
    .skip:focus { top: 8px; }

    .i {
      width: 16px; height: 16px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .mono { font-family: var(--font-mono); }
    .num { font-variant-numeric: tabular-nums; }

    /* ═══════ Shell ═══════ */
    .app {
      --panel-w: var(--panel-pref, 320px); /* dashboard.js sets --panel-pref from the resize handle */
      --ctx-w: 0px;
      display: grid;
      grid-template-columns: var(--rail-w) var(--panel-w) minmax(0, 1fr) var(--ctx-w);
      grid-template-rows: var(--topbar-h) auto minmax(0, 1fr);
      grid-template-areas:
        "top top top top"
        "banner banner banner banner"
        "rail panel stage ctx";
      height: 100vh;
      height: 100dvh;
      transition: grid-template-columns var(--t) var(--ease-out);
    }
    .app[data-panel="closed"] { --panel-w: 0px; }
    .app[data-ctx="open"] { --ctx-w: 336px; }
    .app.resizing { transition: none; cursor: col-resize; user-select: none; }

    /* Top bar */
    .topbar {
      grid-area: top;
      display: flex; align-items: center; gap: 6px;
      min-width: 0; padding-right: 10px;
      background: var(--frame);
      border-bottom: 1px solid var(--line);
      position: relative; z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding-left: 18px; min-width: 0; }
    .brand-mark { width: 20px; height: 20px; color: var(--accent); stroke-width: 1.6; }
    .brand-name { font-weight: 600; font-size: 13.5px; letter-spacing: -0.005em; white-space: nowrap; }
    .topbar-meta {
      display: flex; align-items: center; gap: 8px; margin-left: 10px; padding-left: 12px;
      border-left: 1px solid var(--line); color: var(--ink-3); font-size: 12px; white-space: nowrap;
    }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
    .topbar .menu-btn { display: none; }

    .conn {
      display: inline-flex; align-items: center; gap: 7px;
      height: 26px; padding: 0 10px; margin-right: 6px;
      border-radius: 13px; border: 1px solid var(--line);
      font-size: 12px; color: var(--ink-2); white-space: nowrap;
    }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); }
    .conn[data-state="live"] .conn-dot { background: var(--ok); }
    .conn[data-state="reconnecting"] .conn-dot { background: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
    .conn[data-state="offline"] { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
    .conn[data-state="offline"] .conn-dot { background: var(--bad); }
    .conn[data-state="connecting"] .conn-dot { background: var(--ink-3); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }

    .palette-btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 28px; padding: 0 6px 0 9px; margin-right: 4px;
      border-radius: 7px; border: 1px solid var(--line-2); background: transparent;
      color: var(--ink-3); font-size: 12px; cursor: pointer;
    }
    .palette-btn:hover { color: var(--ink); background: var(--hover); }

    kbd {
      display: inline-block; min-width: 18px; padding: 0 5px;
      font: 500 11px/18px var(--font-mono); text-align: center;
      border-radius: 4px; border: 1px solid var(--line-2); background: var(--raised); color: var(--ink-2);
    }

    /* Connection banner (only while live updates are paused) */
    .banner {
      grid-area: banner;
      display: flex; align-items: center; gap: 10px; padding: 7px 16px;
      background: var(--warn-soft); border-bottom: 1px solid var(--line);
      font-size: 12.5px; color: var(--ink);
    }
    .banner .i { color: var(--warn); }
    .banner[data-state="offline"] { background: var(--bad-soft); }
    .banner[data-state="offline"] .i { color: var(--bad); }
    .banner .btn { margin-left: auto; }

    /* Rail */
    .rail {
      grid-area: rail;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 10px 0; overflow-y: auto; overflow-x: hidden;
      background: var(--frame); border-right: 1px solid var(--line);
      z-index: 46;
    }
    .rail-sep { width: 22px; height: 1px; margin: 7px 0; background: var(--line-2); flex: none; }
    .rail-tab {
      position: relative; flex: none;
      width: 40px; height: 40px; display: grid; place-items: center;
      border: 0; border-radius: 9px; background: transparent;
      color: var(--ink-3); cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .rail-tab:hover { background: var(--hover); color: var(--ink); }
    .rail-tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-hi); }
    .app[data-panel="closed"] .rail-tab[aria-selected="true"] { background: transparent; color: var(--ink-2); }
    .rail-tab .i { width: 19px; height: 19px; }
    .rail-count {
      position: absolute; top: 2px; right: 1px;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
      font: 600 10px/16px var(--font-sans); font-variant-numeric: tabular-nums; text-align: center;
      background: var(--raised-2); color: var(--ink-2);
      box-shadow: 0 0 0 2px var(--frame);
    }
    .rail-count:empty { display: none; }
    .rail-count[data-tone="warn"] { background: var(--warn); color: #1f1606; }
    .rail-count[data-tone="bad"] { background: var(--bad); color: #1d090d; }
    :root[data-theme="light"] .rail-count[data-tone="warn"], :root[data-theme="light"] .rail-count[data-tone="bad"] { color: #ffffff; }
    .rail-foot { margin-top: auto; padding-top: 8px; }

    /* Section panel */
    .panel {
      grid-area: panel;
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      position: relative; overflow: hidden;
      background: var(--panel); border-right: 1px solid var(--line);
      z-index: 45;
    }
    .app[data-panel="closed"] .panel { border-right: 0; }
    .panel-head { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px 0 16px; flex: none; }
    .panel-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
    .panel-sub { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 20px; }
    .panel-note { padding: 12px 8px 4px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
    .resizer {
      position: absolute; top: 0; right: 0; bottom: 0; width: 7px;
      cursor: col-resize; z-index: 5; touch-action: none;
    }
    .resizer::after {
      content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 2px;
      background: var(--accent-line); opacity: 0; transition: opacity var(--t-fast);
    }
    .resizer:hover::after, .resizer:focus-visible::after, .app.resizing .resizer::after { opacity: 1; }
    .resizer:focus-visible { outline: none; }

    /* Stage */
    .stage {
      grid-area: stage;
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--stage); position: relative;
    }
    .conv-head {
      display: flex; align-items: center; gap: 12px; flex: none;
      height: 52px; padding: 0 14px 0 20px; border-bottom: 1px solid var(--line);
    }
    .scope { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .scope-text { display: grid; min-width: 0; }
    .scope-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scope-sub { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scope-actions { display: flex; align-items: center; gap: 2px; flex: none; }
    .search { position: relative; margin-left: auto; width: min(280px, 42%); flex: none; }
    .search .i { position: absolute; left: 10px; top: 8px; color: var(--ink-3); pointer-events: none; }
    .search input {
      width: 100%; height: 32px; padding: 0 64px 0 32px;
      border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised);
      font-size: 13px; color: var(--ink);
    }
    .search input::placeholder { color: var(--ink-3); }
    .search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
    .search input::-webkit-search-cancel-button { display: none; }
    .search-count { position: absolute; right: 32px; top: 0; height: 32px; display: flex; align-items: center; font-size: 11.5px; color: var(--ink-3); }
    .search-clear { position: absolute; right: 2px; top: 2px; width: 28px; height: 28px; }

    /* Pinned strip */
    .pins { flex: none; border-bottom: 1px solid var(--line); }
    .pins-bar { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px 0 20px; font-size: 13px; }
    .pins-bar > .i { color: var(--warn); }
    .pins-label { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
    .pins-latest { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); }
    .pins-latest b { color: var(--ink-2); font-weight: 500; }
    .pins-list { display: grid; gap: 1px; padding: 0 12px 8px 14px; }
    .pin-row { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 4px 0 6px; border-radius: 7px; }
    .pin-row:hover { background: var(--hover); }
    .pin-text { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink-2); }

    /* Timeline */
    .timeline-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .timeline { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px 0 18px; }
    .timeline:focus-visible { outline-offset: -2px; }
    .timeline-col { max-width: var(--measure); margin: 0 auto; padding: 0 24px; }
    .timeline-intro { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; color: var(--ink-3); font-size: 12.5px; }
    .timeline-earlier { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 12px; margin: 2px 0 10px; color: var(--ink-3); font-size: 12.5px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 8px; color: var(--ink-3); font-size: 12px; font-weight: 500; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .msg {
      position: relative;
      display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px;
      margin: 0 -12px; padding: 4px 12px; border-radius: 10px;
    }
    .msg.start { margin-top: 14px; padding-top: 8px; }
    .msg:hover, .msg:focus-within { background: var(--hover); }
    .msg.flash { animation: flash 1.6s var(--ease-out); }
    @keyframes flash { 0%, 30% { background: var(--accent-soft); } }
    .msg.enter { animation: msg-in 260ms var(--ease-out); }
    @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
    .msg-gutter { grid-column: 1; position: relative; }
    .msg-gutter-time {
      position: absolute; right: 0; top: 4px; width: 46px; text-align: right;
      font-size: 10.5px; color: var(--ink-3); opacity: 0; transition: opacity var(--t-fast);
      font-variant-numeric: tabular-nums;
    }
    .msg:hover .msg-gutter-time, .msg:focus-within .msg-gutter-time { opacity: 1; }
    .msg-main { grid-column: 2; min-width: 0; }
    .msg-head { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 7px; row-gap: 2px; min-width: 0; line-height: 20px; margin-bottom: 2px; }
    .msg-from { font-weight: 600; font-size: 14px; }
    .msg-route { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 13px; min-width: 0; }
    .msg-route .i { width: 13px; height: 13px; align-self: center; }
    .msg-route .name { font-weight: 500; }
    .msg-time { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
    .msg-state { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
    .msg-body { color: var(--ink-body); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
    .msg-body[dir="rtl"] { line-height: 1.85; }
    .msg-body.plain { white-space: pre-wrap; }
    .msg-fail {
      display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; padding: 7px 10px;
      border-radius: 8px; background: var(--bad-soft); color: var(--ink); font-size: 12.5px;
    }
    .msg-fail .i { color: var(--bad); margin-top: 2px; width: 14px; height: 14px; }
    .msg-note { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
    .msg-note .i { width: 13px; height: 13px; color: var(--violet); }
    .linkish { border: 0; background: none; padding: 0; color: var(--accent-hi); font-size: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    .link-host { color: var(--ink-3); font-size: 0.9em; }

    /* Signature: delivery track */
    .track { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .track-steps { display: inline-flex; align-items: center; }
    .track-dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-4); }
    .track-link { width: 6px; height: 1.5px; background: var(--ink-4); }
    .track[data-state="sent"] .s1 { background: var(--ink-2); box-shadow: none; }
    .track[data-state="delivered"] .s1, .track[data-state="delivered"] .s2 { background: var(--info); box-shadow: none; }
    .track[data-state="delivered"] .l1 { background: var(--info); }
    .track[data-state="acknowledged"] .track-dot { background: var(--ok); box-shadow: none; }
    .track[data-state="acknowledged"] .track-link { background: var(--ok); }
    .track[data-state="failed"] { color: var(--bad); }
    .track[data-state="failed"] .i { width: 14px; height: 14px; }
    .track .grow { animation: step-in 420ms var(--ease-out); }
    @keyframes step-in { from { transform: scale(0.2); opacity: 0.2; } }

    /* Kind badge (structured messages) */
    .kind {
      display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 5px;
      font-size: 11.5px; font-weight: 500; white-space: nowrap; align-self: center;
      background: var(--raised-2); color: var(--ink-2);
    }
    .kind .i { width: 12px; height: 12px; }
    .kind[data-kind="question"] { background: var(--info-soft); color: var(--info); }
    .kind[data-kind="decision"] { background: var(--violet-soft); color: var(--violet); }
    .kind[data-kind="context_share"] { background: var(--ok-soft); color: var(--ok); }
    .kind[data-kind="review_request"] { background: var(--warn-soft); color: var(--warn); }
    /* handoff keeps the neutral base: the accent is reserved for actions, selection and focus */

    /* Message actions (hover toolbar; always visible on touch) */
    .msg-actions {
      position: absolute; top: -14px; right: 10px; z-index: 2;
      display: flex; gap: 1px; padding: 2px;
      border-radius: 8px; border: 1px solid var(--line-2); background: var(--overlay);
      box-shadow: var(--shadow-pop);
      opacity: 0; pointer-events: none; transform: translateY(3px);
      transition: opacity var(--t-fast), transform var(--t-fast);
    }
    .msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; pointer-events: auto; transform: none; }
    .msg-actions .icon-btn { width: 28px; height: 28px; }
    .msg-actions .icon-btn[aria-pressed="true"] { color: var(--warn); }
    .msg-actions .icon-btn.on { color: var(--violet); }

    /* Markdown */
    .md > * + * { margin-top: 8px; }
    .md p, .md li, .md blockquote { max-width: 72ch; }
    .md .md-h { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .md .md-h1 { font-size: 16px; }
    .md .md-h2 { font-size: 15px; }
    .md > .md-h:not(:first-child) { margin-top: 14px; }
    .md strong { font-weight: 600; color: var(--ink); }
    .md em { font-style: italic; }
    .md del { color: var(--ink-3); }
    .md ul, .md ol { padding-left: 22px; }
    .md li + li { margin-top: 3px; }
    .md li::marker { color: var(--ink-3); }
    .md li.task { list-style: none; position: relative; }
    .md li.task .i { position: absolute; left: -20px; top: 4px; width: 14px; height: 14px; color: var(--ink-3); }
    .md li.task.done .i { color: var(--ok); }
    .md a { color: var(--accent-hi); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    .md code {
      font: 12.5px/1.4 var(--font-mono); padding: 1px 5px; border-radius: 4px;
      background: var(--raised); border: 1px solid var(--line); color: var(--ink);
    }
    .md blockquote { padding-left: 12px; border-left: 2px solid var(--line-3); color: var(--ink-2); }
    .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    .md mark { background: rgba(227, 180, 86, 0.3); color: var(--ink); border-radius: 2px; padding: 0 1px; }
    .code { border: 1px solid var(--line); border-radius: 8px; background: var(--frame); overflow: hidden; }
    :root[data-theme="light"] .code { background: #f4f2ee; }
    .code-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 30px; padding: 0 4px 0 12px; border-bottom: 1px solid var(--line);
      font: 11.5px var(--font-mono); color: var(--ink-3);
    }
    .code-head .icon-btn { width: 24px; height: 24px; }
    .code-head .icon-btn .i { width: 14px; height: 14px; }
    .code pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); color: var(--ink-body); tab-size: 2; }
    .code pre code { all: unset; white-space: pre; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    .md table { border-collapse: collapse; font-size: 13px; line-height: 1.45; min-width: 100%; }
    .md th, .md td { padding: 7px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    .md th { font-weight: 600; color: var(--ink); background: var(--raised); white-space: nowrap; }
    .md tr:last-child td { border-bottom: 0; }
    .md td + td, .md th + th { border-left: 1px solid var(--line); }

    /* Structured fields */
    .struct {
      display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px;
      margin-top: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      font-size: 13.5px; line-height: 1.5;
    }
    .struct dt { color: var(--ink-3); font-size: 12.5px; padding-top: 1px; white-space: nowrap; }
    .struct dd { color: var(--ink-body); min-width: 0; }
    .struct dd ul { padding-left: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip-mono {
      font: 11.5px/18px var(--font-mono); padding: 0 6px; border-radius: 4px;
      background: var(--raised); border: 1px solid var(--line); color: var(--ink-2); overflow-wrap: anywhere;
    }

    /* Context snapshot */
    .ctx { margin-top: 8px; }
    .ctx summary {
      display: inline-flex; align-items: center; gap: 6px; padding: 1px 6px 1px 4px; margin-left: -4px;
      border-radius: 6px; list-style: none; cursor: pointer; font-size: 12.5px; color: var(--ink-3);
    }
    .ctx summary::-webkit-details-marker { display: none; }
    .ctx summary:hover { color: var(--ink); background: var(--hover); }
    .ctx summary .chev { width: 13px; height: 13px; transition: transform var(--t-fast); }
    .ctx[open] summary .chev { transform: rotate(90deg); }
    .ctx-body { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin-top: 6px; padding-left: 4px; font-size: 12.5px; color: var(--ink-2); }
    .ctx-body dt { color: var(--ink-3); }

    /* Reactions */
    .reactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .reaction {
      display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
      border-radius: 13px; border: 1px solid var(--line-2); background: transparent;
      font-size: 13px; color: var(--ink-2); cursor: pointer;
    }
    .reaction:hover { background: var(--hover); border-color: var(--line-3); }
    .reaction[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); }
    .reaction[aria-disabled="true"] { opacity: 0.6; cursor: progress; }
    .reaction .n { font-size: 12px; font-variant-numeric: tabular-nums; }

    .jump {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
      border-radius: 15px; border: 1px solid var(--line-2); background: var(--overlay);
      color: var(--ink); font-size: 12.5px; font-weight: 500; cursor: pointer;
      box-shadow: var(--shadow-pop); z-index: 3;
    }
    .jump .i { width: 14px; height: 14px; color: var(--accent-hi); }

    /* Composer */
    .composer { flex: none; padding: 10px 24px 14px; border-top: 1px solid var(--line); background: var(--stage); }
    .composer-col { max-width: calc(var(--measure) - 48px); margin: 0 auto; }
    .composer-top { display: flex; align-items: center; gap: 10px; min-height: 30px; margin-bottom: 8px; }
    .to-label { color: var(--ink-3); font-size: 12.5px; }
    .recipient {
      position: relative; display: inline-flex; align-items: center; gap: 8px;
      height: 30px; padding: 0 6px 0 4px; max-width: 70%;
      border-radius: 8px; border: 1px solid var(--line-2);
    }
    .recipient:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
    .recipient .tile { width: 22px; height: 22px; border-radius: 6px; font-size: 9.5px; }
    .recipient select {
      appearance: none; -webkit-appearance: none; min-width: 0;
      border: 0; background: transparent; padding: 0 20px 0 0;
      font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; text-overflow: ellipsis;
    }
    .recipient select:focus-visible { outline: none; }
    .recipient select option, .recipient select optgroup { background: var(--overlay); color: var(--ink); }
    .recipient .chev { position: absolute; right: 6px; top: 7px; width: 14px; height: 14px; color: var(--ink-3); pointer-events: none; }
    .recipient[data-empty] .tile { background: transparent; box-shadow: inset 0 0 0 1px var(--line-3); }
    .typing { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dots { display: inline-flex; gap: 3px; }
    .dots span { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: dot 1.3s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: 0.18s; }
    .dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dot { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }
    .composer-alert {
      display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; padding: 8px 6px 8px 10px;
      border-radius: 8px; background: var(--bad-soft); font-size: 13px; color: var(--ink);
    }
    .composer-alert > .i { color: var(--bad); margin-top: 2px; }
    .composer-alert[data-tone="warn"] { background: var(--warn-soft); }
    .composer-alert[data-tone="warn"] > .i { color: var(--warn); }
    .composer-alert .grow { flex: 1; min-width: 0; }
    .composer-alert .icon-btn { width: 24px; height: 24px; margin-top: -2px; }
    .composer-box {
      display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 12px;
      border-radius: 12px; border: 1px solid var(--line-2); background: var(--raised);
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .composer-box[data-disabled] { opacity: 0.7; }
    .composer textarea {
      flex: 1; min-width: 0; min-height: 22px; max-height: 40vh; padding: 6px 0; resize: none;
      border: 0; outline: none; background: transparent;
      font-size: 14px; line-height: 1.55; color: var(--ink);
    }
    .composer textarea::placeholder { color: var(--ink-3); }
    .send {
      width: 34px; height: 34px; flex: none; display: grid; place-items: center;
      border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
      transition: background var(--t-fast), opacity var(--t-fast);
    }
    .send:hover { background: var(--accent-hi); }
    .send:disabled { background: var(--raised-2); color: var(--ink-4); cursor: not-allowed; }
    .send[aria-busy="true"] { background: var(--accent); color: var(--accent-ink); cursor: progress; }
    .send .i { width: 17px; height: 17px; stroke-width: 2; }
    .composer-foot { display: flex; align-items: center; gap: 12px; min-height: 18px; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
    .composer-status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .composer-status[data-tone="ok"] { color: var(--ok); }
    .composer-hint { margin-left: auto; white-space: nowrap; }
    .char-count { font-variant-numeric: tabular-nums; }
    .char-count[data-tone="warn"] { color: var(--warn); }
    .char-count[data-tone="bad"] { color: var(--bad); }

    /* Context column / drawer */
    .context {
      grid-area: ctx;
      display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
      background: var(--panel); border-left: 1px solid var(--line);
      z-index: 45;
    }
    .app:not([data-ctx="open"]) .context { visibility: hidden; border-left: 0; }
    .ctx-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 10px 14px 16px; border-bottom: 1px solid var(--line); flex: none; }
    .ctx-head .tile { width: 40px; height: 40px; border-radius: 10px; font-size: 13px; }
    .ctx-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ctx-status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
    .ctx-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 24px; }
    .ctx-section { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .ctx-section:last-child { border-bottom: 0; }
    .ctx-section > h3 { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
    .ctx-section > h3 .count { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
    .ctx-summary { font-size: 13.5px; color: var(--ink-body); line-height: 1.55; }
    .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 14px; font-size: 12.5px; }
    .facts dt { color: var(--ink-3); }
    .facts dd { color: var(--ink-body); min-width: 0; overflow-wrap: anywhere; }
    .field-hint { margin-top: 6px; font-size: 12px; color: var(--ink-3); line-height: 1.45; }
    .field-error { margin-top: 6px; font-size: 12px; color: var(--bad); line-height: 1.45; }

    .scrim { position: fixed; inset: var(--topbar-h) 0 0 0; z-index: 44; background: var(--scrim); }

    /* ═══════ Components ═══════ */
    .icon-btn {
      position: relative; width: 30px; height: 30px; display: inline-grid; place-items: center; flex: none;
      border: 0; border-radius: 7px; background: transparent; color: var(--ink-3); cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .icon-btn:hover { background: var(--hover); color: var(--ink); }
    .icon-btn:active { background: var(--press); }
    .icon-btn:disabled, .icon-btn[aria-disabled="true"] { color: var(--ink-4); cursor: not-allowed; background: transparent; }
    .icon-btn[aria-busy="true"] { cursor: progress; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
      height: 28px; padding: 0 10px; border-radius: 7px;
      border: 1px solid var(--line-2); background: var(--raised); color: var(--ink);
      font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .btn:hover { background: var(--raised-2); border-color: var(--line-3); }
    /* Busy and unavailable buttons use aria-disabled so they keep keyboard focus; they look the same as disabled ones. */
    .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
    .btn[aria-disabled="true"]:hover { background: var(--raised); border-color: var(--line-2); }
    .btn .i { width: 14px; height: 14px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
    .btn-primary[aria-disabled="true"]:hover { background: var(--accent); border-color: var(--accent); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
    .btn-ghost:hover { background: var(--hover); border-color: transparent; color: var(--ink); }
    .btn-danger { color: var(--bad); }
    .btn-danger.solid { background: var(--bad); border-color: var(--bad); color: #1d090d; }
    :root[data-theme="light"] .btn-danger.solid { color: #ffffff; }
    .btn[data-tone="ok"] .i { color: var(--ok); }
    .btn[data-tone="bad"] .i { color: var(--bad); }
    .btn[aria-pressed="true"][data-tone="ok"] { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
    .btn[aria-pressed="true"][data-tone="bad"] { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
    .btn[aria-busy="true"] { cursor: progress; }

    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .input {
      width: 100%; height: 32px; padding: 0 10px; border-radius: 7px;
      border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); font-size: 13px;
    }
    .input::placeholder { color: var(--ink-3); }
    .input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
    .input[aria-invalid="true"] { border-color: var(--bad); }
    .select { position: relative; }
    .select select {
      appearance: none; -webkit-appearance: none; width: 100%; height: 32px; padding: 0 30px 0 10px;
      border-radius: 7px; border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); font-size: 13px; cursor: pointer;
    }
    .select select:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
    .select select:disabled { opacity: 0.6; cursor: progress; }
    .select select option, .select select optgroup { background: var(--overlay); color: var(--ink); }
    .select .i { position: absolute; right: 9px; top: 9px; width: 14px; height: 14px; color: var(--ink-3); pointer-events: none; }

    .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); }
    .seg button {
      height: 22px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent;
      font-size: 12px; color: var(--ink-3); cursor: pointer; white-space: nowrap;
    }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-pressed="true"] { background: var(--raised-2); color: var(--ink); }
    .seg .n { margin-left: 4px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; flex: none;
      border-radius: 5px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
      background: var(--raised-2); color: var(--ink-2);
    }
    .badge .i { width: 12px; height: 12px; }
    .badge[data-tone="ok"] { background: var(--ok-soft); color: var(--ok); }
    .badge[data-tone="warn"] { background: var(--warn-soft); color: var(--warn); }
    .badge[data-tone="bad"] { background: var(--bad-soft); color: var(--bad); }
    .badge[data-tone="info"] { background: var(--info-soft); color: var(--info); }
    .badge[data-tone="violet"] { background: var(--violet-soft); color: var(--violet); }
    .badge[data-tone="accent"] { background: var(--accent-soft); color: var(--accent-hi); }

    /* Identity tiles and names */
    .tile {
      position: relative; width: 32px; height: 32px; flex: none;
      display: grid; place-items: center; border-radius: 8px;
      font: 600 11px/1 var(--font-mono); letter-spacing: 0.02em;
      background: var(--raised-2); color: var(--ink-2);
    }
    .tile.hue { background: hsl(var(--h) 40% 70% / var(--peer-tile-a)); color: hsl(var(--h) 55% 78%); }
    .name.hue { color: hsl(var(--h) 50% 74%); }
    :root[data-theme="light"] .tile.hue { color: hsl(var(--h) 45% 32%); }
    :root[data-theme="light"] .name.hue { color: hsl(var(--h) 45% 36%); }
    @supports (color: oklch(0 0 0)) {
      .tile.hue { background: oklch(var(--peer-l) var(--peer-c) var(--h) / var(--peer-tile-a)); color: oklch(var(--peer-tile-l) var(--peer-c) var(--h)); }
      .name.hue, :root[data-theme="light"] .name.hue { color: oklch(var(--peer-l) var(--peer-c) var(--h)); }
      :root[data-theme="light"] .tile.hue { color: oklch(var(--peer-tile-l) var(--peer-c) var(--h)); }
    }
    .tile.you { background: var(--raised-2); color: var(--ink); }
    .name.you { color: var(--ink); }
    .tile.cli { background: var(--raised-2); color: var(--ink-2); }
    .tile .i { width: 15px; height: 15px; }
    .tile.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 8px; }
    .avatar { position: relative; display: inline-flex; flex: none; align-self: start; line-height: 0; }
    .presence {
      position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 0 2.5px var(--ring, var(--panel));
    }
    .presence[data-status="away"] { background: var(--warn); }
    .presence[data-status="busy"] { background: var(--violet); }
    .presence[data-status="busy"]::after { content: ""; position: absolute; left: 2.5px; right: 2.5px; top: 4.75px; height: 1.5px; border-radius: 1px; background: var(--ring, var(--panel)); }
    .presence[data-status="idle"] { background: var(--ring, var(--panel)); box-shadow: 0 0 0 2.5px var(--ring, var(--panel)), inset 0 0 0 2px var(--ink-3); }
    .who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; vertical-align: middle; }
    .who .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who-btn { border: 0; background: none; padding: 0; cursor: pointer; font-size: inherit; color: inherit; border-radius: 4px; }
    .who-btn:hover .name { text-decoration: underline; text-underline-offset: 2px; }

    /* Roster */
    .group-head {
      display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 8px; margin-top: 8px;
      color: var(--ink-3); font-size: 12px; font-weight: 600;
    }
    .group-head .i { width: 14px; height: 14px; }
    .group-head .count { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
    .group-head .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .peer {
      position: relative;
      display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 10px;
      padding: 8px; border-radius: 8px; cursor: pointer;
      --ring: var(--panel);
    }
    .peer:hover { background: var(--hover); --ring: #191817; }
    :root[data-theme="light"] .peer:hover { --ring: #ecebe7; }
    .peer.selected { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent); }
    .peer .tile { width: 30px; height: 30px; margin-top: 1px; }
    .peer-main { min-width: 0; }
    .peer-top { display: flex; align-items: center; gap: 8px; min-width: 0; height: 20px; }
    .peer-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Stretched button: the overlay makes the whole row the click target; focus outlines the row. */
    .peer-btn { display: block; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
    .peer-btn::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }
    .peer-btn:focus-visible { outline: none; }
    .peer-btn:focus-visible::after { outline: 2px solid var(--focus); outline-offset: -2px; }
    .peer-status { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
    .peer-status[data-status="away"] { color: var(--warn); }
    .peer-status[data-status="busy"] { color: var(--violet); }
    .peer-summary {
      margin-top: 2px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .peer-summary.none { color: var(--ink-3); font-style: italic; }
    .peer-meta { display: flex; align-items: center; gap: 10px; margin-top: 5px; min-width: 0; font-size: 11.5px; color: var(--ink-3); }
    .peer-meta span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
    .peer-meta .i { width: 12px; height: 12px; }
    .peer-meta .mono { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .peer-typing { color: var(--ink-2); }

    /* Generic list rows used by every section */
    .row { padding: 11px 8px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row-top { display: flex; align-items: flex-start; gap: 8px; }
    .row-title { font-size: 13.5px; font-weight: 500; line-height: 1.45; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
    .row-text { margin-top: 4px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; }
    .row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 7px; font-size: 12px; color: var(--ink-3); }
    .row-meta .i { width: 12px; height: 12px; }
    .row-meta > span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin-top: 8px; font-size: 12.5px; line-height: 1.5; }
    .kv dt { color: var(--ink-3); }
    .kv dd { color: var(--ink-body); min-width: 0; overflow-wrap: anywhere; }
    .section-label {
      position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px;
      padding: 12px 8px 6px; background: var(--panel); font-size: 12px; font-weight: 600; color: var(--ink-3);
    }
    .section-label .count { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
    .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
    .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--bad-soft); font-size: 12.5px; }
    .confirm p { flex-basis: 100%; color: var(--ink); line-height: 1.45; }

    /* Tasks */
    .task { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 10px; }
    .check {
      width: 18px; height: 18px; margin-top: 1px; padding: 0; display: grid; place-items: center;
      border-radius: 5px; border: 1.5px solid var(--ink-3); background: transparent; color: transparent; cursor: pointer;
      transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
    }
    .check .i { width: 12px; height: 12px; stroke-width: 2.4; }
    .check:hover { border-color: var(--ok); color: var(--ok); }
    .check[aria-busy="true"] { border-color: var(--ok); color: var(--ok); cursor: progress; }
    .check.done { background: var(--ok); border-color: var(--ok); color: #0c1a11; cursor: default; }
    :root[data-theme="light"] .check.done { color: #ffffff; }
    .task.done .row-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }

    /* Files */
    .file { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 10px; }
    .file > .i { margin-top: 2px; color: var(--ink-3); }
    .file.conflict > .i { color: var(--bad); }
    .file-path { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-family: var(--font-mono); font-size: 12.5px; }
    .file-base { color: var(--ink); font-weight: 500; flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-dir { color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
    .file-root { display: flex; align-items: center; gap: 6px; padding: 4px 8px 0; font: 11.5px var(--font-mono); color: var(--ink-3); overflow-wrap: anywhere; }
    .file-owners { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; }

    /* Activity */
    .event { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; padding: 8px; }
    .event:not(:last-child)::before { content: ""; position: absolute; left: 20.5px; top: 38px; bottom: -6px; width: 1px; background: var(--line); }
    .event-icon { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: var(--raised); color: var(--ink-2); }
    .event-icon .i { width: 14px; height: 14px; }
    .event-icon[data-tone="ok"] { background: var(--ok-soft); color: var(--ok); }
    .event-icon[data-tone="warn"] { background: var(--warn-soft); color: var(--warn); }
    .event-icon[data-tone="bad"] { background: var(--bad-soft); color: var(--bad); }
    .event-icon[data-tone="violet"] { background: var(--violet-soft); color: var(--violet); }
    .event-icon[data-tone="info"] { background: var(--info-soft); color: var(--info); }
    .event-text { font-size: 13px; line-height: 1.45; color: var(--ink-body); padding-top: 3px; overflow-wrap: anywhere; }
    .event-text .name { font-weight: 600; }
    .event-detail {
      margin-top: 2px; font-size: 12.5px; line-height: 1.45; color: var(--ink-3); overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .event-time { margin-top: 3px; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    /* Decisions */
    .decision-key { font: 12px var(--font-mono); color: var(--ink-3); overflow-wrap: anywhere; }
    .decision-value { margin-top: 3px; font-size: 13.5px; font-weight: 500; line-height: 1.45; color: var(--ink); }
    .decision.revoked .decision-value { color: var(--ink-3); }

    /* Proposals: ballot */
    .ballot { display: grid; gap: 6px; margin-top: 10px; }
    .ballot-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) max-content; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
    .slots { display: flex; gap: 3px; min-width: 0; }
    .slot { flex: 1 1 0; max-width: 22px; height: 6px; border-radius: 3px; background: var(--raised-2); }
    .slot.approve { background: var(--ok); }
    .slot.reject { background: var(--bad); }
    .voters { display: grid; gap: 5px; margin-top: 10px; }
    .voter { display: grid; grid-template-columns: 14px max-content minmax(0, 1fr); align-items: baseline; column-gap: 7px; font-size: 12.5px; }
    .voter .i { width: 13px; height: 13px; align-self: center; }
    .voter .i.ok { color: var(--ok); }
    .voter .i.bad { color: var(--bad); }
    .voter-reason { color: var(--ink-3); overflow-wrap: anywhere; }

    /* Groups */
    .group-members { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 12.5px; }
    .form { padding: 12px 8px 4px; border-bottom: 1px solid var(--line); }
    .form label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
    .form-row { display: flex; gap: 6px; }
    .form-row > .select { flex: 1; min-width: 0; }
    .form-row > .btn { height: 32px; }

    /* Empty, loading, error */
    .empty { display: grid; justify-items: center; gap: 6px; padding: 36px 16px; text-align: center; color: var(--ink-3); }
    .empty > .i { width: 26px; height: 26px; color: var(--ink-4); margin-bottom: 4px; }
    .empty-title { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
    .empty-body { max-width: 36ch; font-size: 12.5px; line-height: 1.5; }
    .empty-body code { font: 11.5px var(--font-mono); padding: 0 4px; border-radius: 4px; background: var(--raised); }
    .empty .btn { margin-top: 8px; }
    .empty.large { padding: 14vh 20px; }
    .empty.large > .i { width: 34px; height: 34px; }
    .empty.large .empty-title { font-size: 17px; color: var(--ink); }
    .empty.large .empty-body { font-size: 13.5px; max-width: 46ch; }
    .skel { border-radius: 6px; background: var(--raised); animation: skel 1.4s ease-in-out infinite; }
    @keyframes skel { 50% { opacity: 0.45; } }
    .skel-peer { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 8px; }
    .skel-msg { display: grid; grid-template-columns: 32px 1fr; gap: 12px; margin-top: 22px; }

    /* Toasts, tooltip, announcer */
    .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 80; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
    .toast {
      pointer-events: auto; display: flex; align-items: flex-start; gap: 10px;
      min-width: 240px; max-width: 400px; padding: 10px 8px 10px 12px;
      border-radius: 10px; border: 1px solid var(--line-2); background: var(--overlay);
      box-shadow: var(--shadow-pop); font-size: 13px; line-height: 1.45; color: var(--ink);
      animation: toast-in var(--t) var(--ease-out);
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    .toast > .i { margin-top: 2px; color: var(--ink-3); }
    .toast[data-tone="ok"] > .i { color: var(--ok); }
    .toast[data-tone="bad"] > .i { color: var(--bad); }
    .toast[data-tone="warn"] > .i { color: var(--warn); }
    .toast .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .toast .icon-btn { width: 24px; height: 24px; margin-top: -2px; }
    .tip {
      position: fixed; z-index: 90; padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--line-2); background: var(--overlay); color: var(--ink);
      font-size: 12px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow-pop);
    }

    /* Dialogs */
    dialog {
      padding: 0; border: 1px solid var(--line-2); border-radius: 12px;
      background: var(--overlay); color: var(--ink); box-shadow: var(--shadow-pop);
      max-width: calc(100vw - 32px);
    }
    dialog::backdrop { background: var(--scrim); }
    .palette { width: 580px; margin-top: 13vh; }
    .palette[open] { animation: pop-in 140ms var(--ease-out); }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(0.985); } }
    .palette-input { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .palette-input .i { color: var(--ink-3); }
    .palette-input input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: var(--ink); }
    .palette-input input::placeholder { color: var(--ink-3); }
    .palette-list { max-height: min(420px, 52vh); overflow-y: auto; padding: 6px; }
    .palette-group { padding: 8px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
    .palette-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; font-size: 13.5px; cursor: pointer; }
    .palette-item .i { color: var(--ink-3); }
    .palette-item .tile { width: 20px; height: 20px; border-radius: 5px; font-size: 8.5px; }
    .palette-item[aria-selected="true"] { background: var(--press); }
    .palette-item[aria-selected="true"] .i { color: var(--ink); }
    .palette-item .hint { margin-left: auto; color: var(--ink-3); font-size: 12px; }
    .palette-empty { padding: 20px; text-align: center; color: var(--ink-3); font-size: 13px; }
    .palette-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); }
    .report { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
    .report[open] { display: flex; flex-direction: column; animation: pop-in 160ms var(--ease-out); }
    .report-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); flex: none; }
    .report-head h2 { font-size: 14px; font-weight: 600; margin-right: auto; }
    .report-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 22px 26px; color: var(--ink-body); font-size: 14px; line-height: 1.6; }

    /* ═══════ Responsive ═══════ */
    @media (max-width: 1359px) {
      .app[data-ctx="open"] { --ctx-w: 0px; }
      .context {
        position: fixed; top: var(--topbar-h); right: 0; bottom: 0; width: min(380px, 100vw);
        box-shadow: var(--shadow-pop); border-left: 1px solid var(--line-2);
        transform: translateX(104%); transition: transform var(--t) var(--ease-out), visibility 0s linear var(--t);
      }
      .app[data-ctx="open"] .context { transform: none; visibility: visible; transition: transform var(--t) var(--ease-out); }
    }
    @media (max-width: 1099px) {
      .app, .app[data-panel="closed"] { --panel-w: 0px; }
      .panel {
        position: fixed; top: var(--topbar-h); left: var(--rail-w); bottom: 0;
        width: min(360px, calc(100vw - var(--rail-w)));
        box-shadow: var(--shadow-pop); border-right: 1px solid var(--line-2);
        transform: translateX(-104%); visibility: hidden;
        transition: transform var(--t) var(--ease-out), visibility 0s linear var(--t);
      }
      .app[data-panel="open"] .panel { transform: none; visibility: visible; transition: transform var(--t) var(--ease-out); }
      .resizer { display: none; }
    }
    @media (max-width: 719px) {
      :root { --topbar-h: 50px; }
      .app { grid-template-columns: 0 0 minmax(0, 1fr) 0; }
      .topbar .menu-btn { display: inline-grid; margin-left: 6px; }
      .brand { padding-left: 4px; }
      .topbar-meta, .palette-btn kbd, #export-btn { display: none; }
      /* icon-only here, but the label still names the button */
      .palette-btn .label { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .palette-btn { padding: 0; width: 30px; justify-content: center; border: 0; }
      .conn .conn-label { display: none; }
      .conn { padding: 0 8px; margin-right: 2px; }
      .rail {
        position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: var(--rail-w);
        transform: translateX(-100%); visibility: hidden;
        transition: transform var(--t) var(--ease-out), visibility 0s linear var(--t);
      }
      .panel { left: var(--rail-w); width: calc(100vw - var(--rail-w)); max-width: 420px; }
      .app[data-nav="open"] .rail, .app[data-nav="open"] .panel { transform: none; visibility: visible; transition: transform var(--t) var(--ease-out); }
      .app:not([data-nav="open"]) .panel { transform: translateX(-104%); visibility: hidden; }
      .rail-foot { display: none; }
      .conv-head { padding: 0 8px 0 14px; gap: 8px; height: auto; min-height: 52px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
      .search { width: 100%; order: 3; margin-left: 0; }
      .scope-actions { margin-left: auto; }
      .timeline-col { padding: 0 14px; }
      .msg { margin: 0 -8px; padding-left: 8px; padding-right: 8px; column-gap: 10px; }
      .msg-state { margin-left: 0; flex-basis: 100%; }
      .composer { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
      .composer-hint { display: none; }
      .pins-bar { padding-left: 14px; }
      .pins-list { padding-left: 8px; }
      .toasts { left: 12px; right: 12px; bottom: 12px; align-items: stretch; }
      .toast { max-width: none; }
      .palette { margin-top: 8vh; }
      .struct, .kv, .facts, .ctx-body { grid-template-columns: minmax(0, 1fr); gap: 2px; }
      .struct dd + dt, .kv dd + dt, .facts dd + dt, .ctx-body dd + dt { margin-top: 6px; }
    }
    @media (hover: none) {
      /* Touch has no hover: tapping a message shows its actions as a quiet row under it. Until then they are only
         visually hidden, so screen readers still reach them. */
      .msg-actions {
        position: absolute; top: auto; right: auto; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
        opacity: 1; pointer-events: auto; transform: none;
        box-shadow: none; background: transparent; border: 0; gap: 0;
      }
      .msg.show-actions .msg-actions, .msg:focus-within .msg-actions {
        position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal;
        grid-column: 2; justify-self: end; margin: 2px -6px -2px 0;
      }
      .msg-actions .icon-btn { width: 36px; height: 36px; color: var(--ink-2); }
      .msg-actions .icon-btn .i { width: 16px; height: 16px; }
      .msg-gutter-time { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (forced-colors: active) {
      .rail-tab[aria-selected="true"], .peer[aria-pressed="true"], .seg button[aria-pressed="true"], .reaction[aria-pressed="true"] { outline: 2px solid Highlight; }
      .track-dot, .slot, .presence, .conn-dot { forced-color-adjust: none; }
    }
  </style>
</head>

      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" /><path d="M9.5 4.5v15" /></symbol>

  <a class="skip" href="#timeline">Skip to conversation</a>
  <a class="skip" href="#composer-text">Skip to message composer</a>

  <div class="app" id="cp-root" data-panel="open">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="rail">
        <svg class="i"><use href="#i-menu" /></svg>
      </button>
      <div class="brand">
        <svg class="i brand-mark" aria-hidden="true"><use href="#i-logo" /></svg>
        <span class="brand-name">claude-peers</span>
      </div>
      <div class="topbar-meta"><span class="num" id="uptime">Connecting to the broker…</span></div>
      <div class="topbar-right">
        <div class="conn" id="conn" data-state="connecting" role="status">
          <span class="conn-dot" aria-hidden="true"></span><span class="conn-label" id="conn-label">Connecting…</span>
        </div>
        <button class="palette-btn" id="palette-btn" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K">
          <svg class="i" aria-hidden="true"><use href="#i-search" /></svg><span class="label">Commands</span><kbd aria-hidden="true">Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="export-btn" type="button" data-tip="Export conversation (.txt)" aria-label="Export conversation">
          <svg class="i"><use href="#i-download" /></svg>
        </button>
        <button class="icon-btn" id="theme-btn" type="button" data-tip="Switch to light theme" aria-label="Switch to light theme">
          <svg class="i"><use href="#i-sun" /></svg>
        </button>
      </div>
    </header>

    <div class="banner" id="conn-banner" role="status" hidden>
      <svg class="i" aria-hidden="true"><use href="#i-offline" /></svg>
      <span id="conn-banner-text"></span>
      <button class="btn" id="conn-retry" type="button"><svg class="i" aria-hidden="true"><use href="#i-refresh" /></svg>Retry now</button>
    </div>

    <nav class="rail" id="rail" aria-label="Sections">
      <div role="tablist" aria-orientation="vertical" aria-label="Sections" id="rail-tabs" style="display:contents">
        <button class="rail-tab" role="tab" id="tab-peers" data-section="peers" data-tip="Peers" aria-selected="true" aria-controls="panel-body" type="button"><svg class="i" aria-hidden="true"><use href="#i-peers" /></svg><span class="rail-count" data-count="peers"></span><span class="sr-only" data-label="peers">Peers</span></button>
        <button class="rail-tab" role="tab" id="tab-groups" data-section="groups" data-tip="Groups" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-groups" /></svg><span class="rail-count" data-count="groups"></span><span class="sr-only" data-label="groups">Groups</span></button>
        <span class="rail-sep" aria-hidden="true"></span>
        <button class="rail-tab" role="tab" id="tab-tasks" data-section="tasks" data-tip="Tasks" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-tasks" /></svg><span class="rail-count" data-count="tasks"></span><span class="sr-only" data-label="tasks">Tasks</span></button>
        <button class="rail-tab" role="tab" id="tab-files" data-section="files" data-tip="Active files" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-files" /></svg><span class="rail-count" data-count="files"></span><span class="sr-only" data-label="files">Active files</span></button>
        <button class="rail-tab" role="tab" id="tab-activity" data-section="activity" data-tip="Activity" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-activity" /></svg><span class="sr-only" data-label="activity">Activity</span></button>
        <span class="rail-sep" aria-hidden="true"></span>
        <button class="rail-tab" role="tab" id="tab-decisions" data-section="decisions" data-tip="Decisions" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-decisions" /></svg><span class="rail-count" data-count="decisions"></span><span class="sr-only" data-label="decisions">Decisions</span></button>
        <button class="rail-tab" role="tab" id="tab-verifications" data-section="verifications" data-tip="Verifications" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-verifications" /></svg><span class="rail-count" data-count="verifications"></span><span class="sr-only" data-label="verifications">Verifications</span></button>
        <button class="rail-tab" role="tab" id="tab-proposals" data-section="proposals" data-tip="Proposals" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-proposals" /></svg><span class="rail-count" data-count="proposals"></span><span class="sr-only" data-label="proposals">Proposals</span></button>
        <button class="rail-tab" role="tab" id="tab-approvals" data-section="approvals" data-tip="Approvals" aria-selected="false" aria-controls="panel-body" type="button" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-approvals" /></svg><span class="rail-count" data-count="approvals"></span><span class="sr-only" data-label="approvals">Approvals</span></button>
      </div>
      <div class="rail-foot">
        <button class="icon-btn" id="panel-toggle" type="button" data-tip="Collapse panel" aria-label="Collapse panel" aria-expanded="true" aria-controls="panel">
          <svg class="i"><use href="#i-sidebar" /></svg>
        </button>
      </div>
    </nav>

    <aside class="panel" id="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 class="panel-title" id="panel-title">Peers</h2>
        <span class="panel-sub" id="panel-sub"></span>
        <div class="panel-actions" id="panel-actions"></div>
      </div>
      <div class="panel-body" id="panel-body" role="tabpanel" aria-labelledby="tab-peers" tabindex="-1"></div>
      <div class="resizer" id="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panel" aria-controls="panel" aria-valuemin="260" aria-valuemax="480" aria-valuenow="320" tabindex="0"></div>
    </aside>

    <main class="stage" id="stage">
      <div class="conv-head">
        <div class="scope" id="scope"></div>
        <div class="search" role="search">
          <svg class="i" aria-hidden="true"><use href="#i-search" /></svg>
          <input type="search" id="search-input" placeholder="Search messages" autocomplete="off" spellcheck="false" aria-label="Search messages" aria-describedby="search-count">
          <span class="search-count" id="search-count" aria-live="polite"></span>
          <button class="icon-btn search-clear" id="search-clear" type="button" aria-label="Clear search" hidden><svg class="i"><use href="#i-x" /></svg></button>
        </div>
        <div class="scope-actions" id="scope-actions"></div>
      </div>
      <div class="pins" id="pins" hidden></div>
      <div class="timeline-wrap">
        <div class="timeline" id="timeline" role="log" aria-label="Conversation" aria-live="off" tabindex="0">
          <div class="timeline-col" id="timeline-col"></div>
        </div>
        <button class="jump" id="jump-new" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-arrow-down" /></svg><span id="jump-label">New messages</span></button>
      </div>
      <form class="composer" id="composer" aria-label="Send a message" novalidate>
        <div class="composer-col">
          <div class="composer-alert" id="composer-alert" role="alert" hidden></div>
          <div class="composer-top">
            <span class="to-label" id="to-label">To</span>
            <div class="recipient" id="recipient-wrap" data-empty>
              <span class="tile sm" id="recipient-tile" aria-hidden="true"></span>
              <select id="recipient" aria-labelledby="to-label" name="recipient"></select>
              <svg class="i chev" aria-hidden="true"><use href="#i-chevron-down" /></svg>
            </div>
            <span class="typing" id="typing" aria-live="polite"></span>
          </div>
          <div class="composer-box" id="composer-box">
            <textarea id="composer-text" name="message" rows="1" placeholder="Message a peer…" aria-label="Message" aria-describedby="composer-hint char-count"></textarea>
            <button class="send" id="send-btn" type="submit" aria-label="Send message" disabled>
              <svg class="i"><use href="#i-send" /></svg>
            </button>
          </div>
          <div class="composer-foot">
            <span class="composer-status" id="composer-status" role="status"></span>
            <span class="composer-hint" id="composer-hint">Enter to send · Shift+Enter for a new line</span>
            <span class="char-count" id="char-count"></span>
          </div>
        </div>
      </form>
    </main>

    <aside class="context" id="context" aria-label="Peer details" tabindex="-1"></aside>
    <div class="scrim" id="scrim" hidden></div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <dialog class="palette" id="palette" aria-label="Command palette">
    <div class="palette-input">
      <svg class="i" aria-hidden="true"><use href="#i-search" /></svg>
      <input id="palette-input" type="text" placeholder="Jump to a section, a peer, or an action…" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" aria-label="Command">
    </div>
    <div class="palette-list" id="palette-list" role="listbox" aria-label="Commands"></div>
    <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
  </dialog>

  <dialog class="report" id="report" aria-labelledby="report-title">
    <div class="report-head">
      <h2 id="report-title">Session report</h2>
      <button class="btn" id="report-copy" type="button" disabled><svg class="i" aria-hidden="true"><use href="#i-copy" /></svg>Copy markdown</button>
      <button class="btn" id="report-download" type="button" disabled><svg class="i" aria-hidden="true"><use href="#i-download" /></svg>Download .md</button>
      <button class="icon-btn" id="report-close" type="button" aria-label="Close session report"><svg class="i"><use href="#i-x" /></svg></button>
    </div>
    <div class="report-body" id="report-body" tabindex="0"></div>
  </dialog>

  <!-- Bump ?v= whenever dashboard.js changes: the broker caches both files for an hour. -->
  <script src="dashboard.js?v=3"></script>
</body>

</html>
